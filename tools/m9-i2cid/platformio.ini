; Diagnostic image for the ThinkNode M9: finds out who answers at 0x7E on the peripheral bus.
; Goes into the app slot (0x10000); the bootloader, settings and file system are not touched.
[env:m9id]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = crowpanel
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0
